<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korund Gym</title>
</head>
<body>
<style>
/* Layout: ein Bildschirm wie ein Spiel-Tab. 3D-Gym füllt alles; oben Stufe, Ruf und Währung; unten vier Reiter (Bauen, Aufträge, Gym, Training) mit Sheets darüber; im Baumodus eine eigene Leiste */
:root {
  --grund: #000000;
  --glas: rgba(20, 24, 31, 0.78);
  --glas-fest: rgba(13, 16, 21, 0.94);
  --kante: rgba(255, 255, 255, 0.11);
  --kante-hell: rgba(255, 255, 255, 0.2);
  --text: #EEF2F7;
  --leise: #A1A4A9;
  --aus: #6B7078;
  --akzent: #7EB0FF;
  --akzent-rgb: 126, 176, 255;
  --gruen: #3DDC84;
  --orange: #FF9F45;
  --gold: #F5C04A;
  --lila: #A98BFF;
  --rot: #FF7A70;
  --schrift: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(110% 70% at 50% 35%, #26252e 0%, #16151b 45%, #0a0a0d 85%); background-color: #0a0a0d; color: var(--text); font-family: var(--schrift); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }
button svg { width: 18px; height: 18px; flex: none; }
.gross-knopf svg { width: 20px; height: 20px; }
.app { position: fixed; inset: 0; }
#welt { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.laden { position: absolute; inset: 0; display: grid; place-items: center; color: var(--leise); font-size: 14px; }

/* Kopf */
.oben { position: absolute; left: 0; right: 0; top: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.kopf > * { pointer-events: auto; }
.label { color: var(--leise); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
h1 { margin: 3px 0 0; font-size: 27px; font-weight: 750; letter-spacing: -.015em; line-height: 1.1; }
.ruf { margin-top: 8px; width: 170px; }
.ruf-zeile { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--leise); font-variant-numeric: tabular-nums; }
.ruf-balken { margin-top: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.ruf-balken span { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, rgba(var(--akzent-rgb), .6), var(--akzent)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.geld { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pille { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px 0 9px; border: 1px solid var(--kante); border-radius: 18px; background: var(--glas); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); font-weight: 750; font-size: 15px; font-variant-numeric: tabular-nums; cursor: pointer; }
.pille svg { width: 19px; height: 19px; }
.pille.knall { animation: knall .45s cubic-bezier(.2,.8,.2,1.5); }
.wetter { pointer-events: none; align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--leise); padding: 6px 10px; border-radius: 12px; background: rgba(13,16,21,.5); border: 1px solid rgba(255,255,255,.06); }
.wetter b { color: var(--text); font-weight: 650; }

/* Unten */
.unten { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.unten > * { pointer-events: auto; }
.hinweis { pointer-events: none !important; align-self: center; color: var(--aus); font-size: 12px; transition: opacity .4s; text-align: center; }
.reiter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 5px; border-radius: 22px; background: var(--glas); border: 1px solid var(--kante); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); }
.reiter button { height: 52px; border: none; border-radius: 17px; background: none; color: var(--leise); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 650; cursor: pointer; position: relative; transition: background-color .2s, color .2s, transform .14s; }
.reiter button svg { width: 21px; height: 21px; }
.reiter button[aria-selected="true"] { color: var(--text); background: rgba(255,255,255,.07); }
.reiter button:active { transform: scale(.95); }
.punkt { position: absolute; top: 7px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 2px rgba(13,16,21,.9); }
.sheet { border: 1px solid var(--kante); border-radius: 26px; background: var(--glas-fest); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); padding: 14px 14px 12px; animation: rein .3s cubic-bezier(.2,.8,.2,1); max-height: min(46vh, 420px); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 40px rgba(0,0,0,.4); }
.sheet-kopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 4px; }
.sheet-kopf b { font-size: 18px; letter-spacing: -.01em; }
.sheet-inhalt > * { flex: none; }
.sheet-inhalt { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 2px 4px; -webkit-overflow-scrolling: touch; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--kante); background: rgba(255,255,255,.03); color: var(--leise); font-size: 13px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { color: var(--text); border-color: rgba(var(--akzent-rgb), .55); background: rgba(var(--akzent-rgb), .15); }
.raster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.karte { text-align: left; border: 1px solid rgba(255,255,255,.07); border-radius: 18px; background: rgba(255,255,255,.035); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: pointer; transition: transform .14s ease, border-color .2s; position: relative; }
.karte:active { transform: scale(.97); }
.karte .k-symbol { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 4px; background: rgba(var(--akzent-rgb), .12); color: var(--akzent); }
.karte .k-symbol svg { width: 19px; height: 19px; }
.karte .k-name { font-weight: 680; font-size: 14px; }
.karte .k-info { color: var(--leise); font-size: 12px; line-height: 1.35; }
.karte .k-preis { margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; font-weight: 750; font-size: 13px; font-variant-numeric: tabular-nums; }
.karte .k-preis svg { width: 14px; height: 14px; }
.karte.gesperrt { opacity: .45; }
.karte.teuer .k-preis { color: var(--orange); }
.karte.lager { border-color: rgba(61,220,132,.35); }
.karte.lager .k-preis { color: var(--gruen); }
.abschnitt { color: var(--leise); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 4px 0; }

.zeile { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); }
.zeile .z-symbol { flex: none; width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; }
.zeile .z-symbol svg { width: 21px; height: 21px; }
.zeile .z-text { flex: 1; min-width: 0; }
.zeile .z-name { font-weight: 680; font-size: 14.5px; }
.zeile .z-info { color: var(--leise); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
.zeile .z-balken { margin-top: 7px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
.zeile .z-balken span { display: block; height: 100%; border-radius: 2px; background: var(--akzent); }
.zeile.fertig .z-balken span { background: var(--gruen); }
.klein-knopf { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #F0F0F0; color: #07090C; font-weight: 750; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.klein-knopf svg { width: 14px; height: 14px; }
.klein-knopf.leise { background: rgba(255,255,255,.07); color: var(--text); }
.klein-knopf:disabled { opacity: .35; cursor: default; }
.klein-knopf:active:not(:disabled) { transform: scale(.95); }
.farbe-gruen { background: rgba(61,220,132,.14); color: var(--gruen); }
.farbe-orange { background: rgba(255,159,69,.14); color: var(--orange); }
.farbe-gold { background: rgba(245,192,74,.14); color: var(--gold); }
.farbe-lila { background: rgba(169,139,255,.15); color: var(--lila); }
.farbe-akzent { background: rgba(var(--akzent-rgb), .14); color: var(--akzent); }
.farbe-rot { background: rgba(255,122,112,.14); color: var(--rot); }

.stufen-liste { display: flex; flex-direction: column; gap: 8px; }
.farben { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.farbe-knopf { aspect-ratio: 1; border-radius: 16px; border: 1px solid var(--kante); background: rgba(255,255,255,.03); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 11px; color: var(--leise); font-weight: 650; position: relative; }
.farbe-knopf i { width: 22px; height: 22px; border-radius: 50%; display: block; box-shadow: 0 0 14px currentColor; }
.farbe-knopf[aria-pressed="true"] { border-color: var(--kante-hell); color: var(--text); background: rgba(255,255,255,.07); }
.farbe-knopf .preis { position: absolute; top: 5px; right: 6px; font-size: 10px; color: var(--gold); }
.gruppen { display: flex; flex-wrap: wrap; gap: 6px; }
.schalter-zeile { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 4px; color: var(--leise); font-size: 13.5px; }
.gross-knopf { height: 50px; border-radius: 16px; border: none; background: #F0F0F0; color: #07090C; font-weight: 750; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.gross-knopf.leise { background: rgba(255,255,255,.07); color: var(--text); border: 1px solid var(--kante); }
.gross-knopf:active { transform: scale(.98); }
.text-klein { color: var(--leise); font-size: 12.5px; line-height: 1.45; padding: 0 4px; }

/* Infokarte zum Gerät */
.info { border: 1px solid var(--kante); border-radius: 22px; background: var(--glas-fest); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); padding: 14px; display: flex; flex-direction: column; gap: 12px; animation: rein .28s cubic-bezier(.2,.8,.2,1); }
.info-kopf { display: flex; gap: 12px; align-items: flex-start; }
.info .z-symbol { flex: none; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; }
.info .z-symbol svg { width: 22px; height: 22px; }
.info .name { font-weight: 750; font-size: 16.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stufe-marke { font-size: 10.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 8px; }
.stufe-marke.t0 { background: rgba(255,255,255,.08); color: var(--leise); }
.stufe-marke.t1 { background: rgba(192,198,204,.18); color: #dfe4e9; }
.stufe-marke.t2 { background: rgba(var(--akzent-rgb), .18); color: var(--akzent); }
.info .zeile-text { margin-top: 3px; color: var(--leise); font-size: 13px; line-height: 1.45; }
.info .zu { flex: none; margin-left: auto; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255,255,255,.07); color: var(--leise); font-size: 14px; cursor: pointer; }
.info-knoepfe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.info-knoepfe .klein-knopf { justify-content: center; height: 40px; padding: 0 6px; }

/* Baumodus */
.bauleiste { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 6px; border-radius: 22px; background: var(--glas-fest); border: 1px solid var(--kante); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); animation: rein .25s cubic-bezier(.2,.8,.2,1); }
.bauleiste button { height: 50px; border-radius: 16px; border: none; background: rgba(255,255,255,.06); font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.bauleiste button svg { width: 18px; height: 18px; }
.bauleiste button.fertig { background: #F0F0F0; color: #07090C; }
.bauleiste button:disabled { opacity: .4; }

/* Meldungen */
.toast { position: absolute; left: 50%; top: 27%; transform: translate(-50%, -50%); padding: 13px 20px; border-radius: 20px; background: var(--glas-fest); border: 1px solid var(--kante); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); text-align: center; pointer-events: none; animation: toast 2.4s ease forwards; z-index: 8; min-width: 160px; max-width: 80vw; }
.toast b { display: block; font-size: 22px; color: var(--akzent); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.toast span { color: var(--leise); font-size: 12.5px; }
.flieger { position: absolute; left: 0; top: 0; width: 18px; height: 18px; pointer-events: none; z-index: 9; }
.schleier { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(4,6,9,.62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: einblenden .3s ease; padding: 24px; }
.feier { width: min(340px, 100%); border-radius: 28px; background: var(--glas-fest); border: 1px solid var(--kante); padding: 26px 22px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; animation: feier .5s cubic-bezier(.2,.8,.2,1.3); }
.feier .gross-symbol { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px; }
.feier .gross-symbol svg { width: 44px; height: 44px; }
.feier h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.feier p { margin: 0; color: var(--leise); font-size: 14px; line-height: 1.45; }
.feier .belohnung { display: flex; gap: 10px; justify-content: center; margin: 6px 0 8px; flex-wrap: wrap; }
.feier .belohnung span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.06); font-weight: 750; font-variant-numeric: tabular-nums; }
.feier .belohnung svg { width: 18px; height: 18px; }
.truhe-dreh { animation: truhe 1.2s cubic-bezier(.2,.8,.2,1.2) both; }

.datei { display: none; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
@keyframes knall { 0% { transform: scale(1); } 45% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes rein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes einblenden { from { opacity: 0; } to { opacity: 1; } }
@keyframes feier { from { opacity: 0; transform: scale(.85) translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes truhe { 0% { transform: scale(.4) rotate(-20deg); } 60% { transform: scale(1.15) rotate(8deg); } 100% { transform: none; } }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -40%); } 12% { opacity: 1; transform: translate(-50%, -50%); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 760px) { .unten, .oben { max-width: 560px; margin: 0 auto; } }
</style>

<div class="app" id="app">
  <canvas id="welt" aria-label="Dein Gym in 3D. Ziehen zum Drehen, zwei Finger oder Mausrad zum Zoomen, Tippen auf ein Gerät für Infos."></canvas>
  <div class="laden" id="laden">Gym wird aufgebaut …</div>

  <div class="oben">
    <div class="kopf">
      <div>
        <div class="label" id="kopf-label">Dein Gym · Stufe 1</div>
        <h1 id="raum-name">Garage</h1>
        <div class="ruf">
          <div class="ruf-zeile"><span id="ruf-text">Ruf 0</span><span id="ruf-ziel">Kellergym bei 250</span></div>
          <div class="ruf-balken"><span id="ruf-balken"></span></div>
        </div>
      </div>
      <div class="geld">
        <button class="pille" id="pille-splitter" type="button" aria-label="Korund-Splitter"><span id="icon-splitter"></span><span id="splitter">0</span></button>
        <button class="pille" id="pille-kristalle" type="button" aria-label="Kristalle"><span id="icon-kristall"></span><span id="kristalle">0</span></button>
      </div>
    </div>
    <div class="wetter" id="wetter"></div>
  </div>

  <div class="unten">
    <div id="ueber-reiter"></div>
    <div class="hinweis" id="hinweis">Ziehen zum Drehen · Tippen auf ein Gerät</div>
    <div class="reiter" id="reiter" role="tablist"></div>
  </div>
  <input class="datei" type="file" id="datei" accept=".json,application/json">
</div>

<script src="three-0.128.0.min.js"></script>

  function kaufen(k, gesperrt, teuer, schon) {
    if (gesperrt) return toast("Gesperrt", k.name + " gibt es ab " + STUFEN[k.stufe].name);
    if (schon) return toast(k.name, "hängt schon in deinem Gym");

    if (k.kristalle) stand.kristalle -= k.kristalle; else stand.splitter -= k.preis;
    stand.ruf += Math.round((k.preis || k.kristalle * 100) / 10);
    const it = { id: stand.naechsteId++, key: k.key, tier: 0, rot: 0 };
    kopfZeigen(true); rufPruefen();
    if (k.kat === "wand") { stand.wand.push(it); merken(); wandAufbauen(); reiter = null; reiterZeigen(); ueberZeigen(); toast(k.name, "hängt jetzt an der Wand"); return; }

  function aufstellen(it) {
    const k = KATALOG.find(x => x.key === it.key);

    it.i = platz[0]; it.j = platz[1]; it.rot = it.rot || 0;
    stand.items.push(it); merken();
    const obj = itemAufbauen(it, true);
    reiter = null; reiterZeigen();
    baumodusStarten(obj, true);
  }

  function wochenAuftraege() {

    const rest = pool.slice(1); for (let i = 0; i < 2; i++) wahl.push(rest.splice((nr * (i + 3) + i) % rest.length, 1)[0]);
    return wahl;
  }

  function trainingEintragen(datum, gruppen, rekord, vonEl) {
    stand.tage[datum] = { gruppen: gruppen, rekord: rekord };
    const vorher = KATALOG.filter(k => k.gruppen.length).map(k => [k.key, itemZustand(k.key)]);

    toast("+" + lohn.splitter + " Splitter", "Training " + REGEL.tag + (lohn.bonus ? " · Serie +" + lohn.bonus : "") + (lohn.kristalle ? " · Rekord +1 Kristall" : rekord ? " · Rekord +5 Ruf" : ""));
    setTimeout(() => {
      kopfZeigen(true); statusAktualisieren(true);
      const poliert = vorher.filter(v => v[1] === "staubt" && itemZustand(v[0]) === "glaenzt" && stand.items.some(i => i.key === v[0]));
      if (poliert.length) setTimeout(() => toast(KATALOG.find(k => k.key === poliert[0][0]).name, "poliert, glänzt wieder"), 900);

  $("datei").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { importieren(JSON.parse(r.result)); } catch (err) { toast("Datei nicht lesbar", "Bitte ein Korund-Backup wählen"); } e.target.value = ""; };
    r.readAsText(f);
  });
  function gruppeAus(e) {
    const s = ((e.muskelgruppe || "") + " " + (e.uebung || "")).toLowerCase();
    if (/brust|bankdr|fly|butterfly|dips/.test(s)) return "brust";
    if (/lat|rücken|ruecken|trapez|ruder|klimm|kreuzheb|nacken/.test(s)) return "ruecken";
    if (/quadri|beinbeug|bein|po\b|gesäß|waden|adduk|abduk|kniebeug|squat|ausfall|hip/.test(s)) return "beine";
    if (/schulter|delt|seitheb|military|überkopf/.test(s)) return "schultern";
    if (/bizeps|trizeps|unterarm|curl|arm/.test(s)) return "arme";
    return null;
  }
  function importieren(daten) {
    const eintraege = Array.isArray(daten) ? daten : daten && daten.eintraege;
    if (!Array.isArray(eintraege) || !eintraege.length) return toast("Keine Trainings", "In der Datei sind keine Einträge");
    const tage = {}, best = {};
    eintraege.slice().sort((a, b) => String(a.datum).localeCompare(String(b.datum))).forEach(e => {
      const d = new Date(e.datum); if (isNaN(d)) return; const t = iso(d);
      const tg = tage[t] = tage[t] || { gruppen: [], rekord: false };
      const g = gruppeAus(e); if (g && !tg.gruppen.includes(g)) tg.gruppen.push(g);
      // Rekord wie in Korund: bestes geschätztes 1RM (1–10 Wdh., ohne Aufwärmsätze), die erste Ausführung zählt nicht
      const saetze = Array.isArray(e.einzelsaetze) && e.einzelsaetze.length ? e.einzelsaetze : [{ gewicht: e.gewicht, wdh: e.wdh }];
      let rm = 0; saetze.forEach(s => { if (s.aufwaermen) return; const w = +s.wdh, kg = +s.gewicht; if (w >= 1 && w <= 10 && kg > 0) rm = Math.max(rm, w > 1 ? kg * (1 + w / 30) : kg); });
      const key = e.uebungId || e.uebung;
      if (rm > 0) { if (best[key] !== undefined && rm > best[key] + 1e-9) tg.rekord = true; best[key] = Math.max(best[key] || 0, rm); }
    });
    Object.keys(tage).forEach(t => { if (!tage[t].gruppen.length) tage[t].gruppen = ["brust"]; });
    const warDemo = stand.demo;
    if (warDemo) { const neu = startStand(); neu.demo = false; neu.tage = {}; neu.verarbeitet = []; neu.splitter = 300; neu.kristalle = 1; neu.ruf = 0; stand = neu; }
    let summe = { splitter: 0, kristalle: 0, tage: 0, rekorde: 0 };
    Object.keys(tage).sort().forEach(t => { stand.tage[t] = tage[t]; const l = tagVerbuchen(t); if (l) { summe.splitter += l.splitter; summe.kristalle += l.kristalle; summe.tage++; if (tage[t].rekord) summe.rekorde++; } });
    stand.demo = false; stand.demoTage = 0; merken();
    raumBauen(); kopfZeigen(true); reiter = null; reiterZeigen(); ueberZeigen();
    feiern({ symbol: "datei", farbe: "farbe-akzent", titel: summe.tage ? summe.tage + " Trainingstage gefunden" : "Schon alles verbucht", text: summe.tage ? (warDemo ? "Dein echtes Gym ist aufgebaut. " : "") + summe.rekorde + " Tage mit Rekord dabei." : "Neue Trainings kommen mit dem nächsten Backup dazu.", lohn: summe.tage ? { splitter: summe.splitter, kristalle: summe.kristalle } : null, danach: rufPruefen });
  }

    blick.soll = { wpp: Math.max((b - a) / (w - 20), (d - c) / frei) / blick.zoom, mx: (a + b) / 2, my: (c + d) / 2, dy: (p.oben + p.unten) / 2 - h / 2 };
    if (sofort || !blick.ist) blick.ist = Object.assign({}, blick.soll);
  }
  function frustum() {
    const w = canvas.clientWidth, h = canvas.clientHeight, i = blick.ist, hw = w / 2 * i.wpp, hh = h / 2 * i.wpp;
    kamera.left = i.mx - hw; kamera.right = i.mx + hw; kamera.top = i.my + hh + i.dy * i.wpp; kamera.bottom = i.my - hh + i.dy * i.wpp; kamera.updateProjectionMatrix();
  }
  function kameraSetzen() {
    const d = 40, a = Math.PI / 4 + blick.winkel, ziel = new THREE.Vector3(0, 0, 0);
    kamera.position.set(Math.sin(a) * d * Math.cos(blick.neigung), d * Math.sin(blick.neigung), Math.cos(a) * d * Math.cos(blick.neigung));
    kamera.lookAt(ziel);
  }
  const zeiger = new Map(); let zug = null, pinch = null;
  const ray = new THREE.Raycaster(), maus = new THREE.Vector2(), ebene = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function strahl(e) { const r = canvas.getBoundingClientRect(); maus.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(maus, kamera); }
  canvas.addEventListener("pointerdown", e => {
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY }); canvas.setPointerCapture(e.pointerId);
    if (zeiger.size === 2) { const p = [...zeiger.values()]; pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), z: blick.zoom }; zug = null; return; }
    $("hinweis").style.opacity = 0;
    zug = { x: e.clientX, y: e.clientY, w: blick.ziel, bewegt: false, item: false };
    if (baumodus) { strahl(e); const t = ray.intersectObject(baumodus.obj, true); if (t.length) zug.item = true; }
  });
  canvas.addEventListener("pointermove", e => {
    if (!zeiger.has(e.pointerId)) return; zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && zeiger.size === 2) { const p = [...zeiger.values()]; blick.zoom = Math.max(.8, Math.min(2.4, pinch.z * Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) / pinch.d)); kameraAnpassen(); return; }
    if (!zug) return; const dx = e.clientX - zug.x, dy = e.clientY - zug.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) zug.bewegt = true;
    if (zug.item) { strahl(e); const p = new THREE.Vector3(); if (ray.ray.intersectPlane(ebene, p)) geistBewegen(p); return; }
    blick.ziel = Math.max(-.75, Math.min(.75, zug.w + dx * .006));
  });
  function loslassen(e) {
    zeiger.delete(e.pointerId); if (zeiger.size < 2) pinch = null;
    if (zug && !zug.bewegt && !zug.item) tippen(e);
    zug = null;
  }
  canvas.addEventListener("pointerup", loslassen); canvas.addEventListener("pointercancel", loslassen);
  canvas.addEventListener("wheel", e => { e.preventDefault(); blick.zoom = Math.max(.8, Math.min(2.4, blick.zoom * (e.deltaY < 0 ? 1.08 : .93))); kameraAnpassen(); }, { passive: false });

  let auswahl = null, ring = null;
  function tippen(e) {
    strahl(e);
    if (baumodus) { const p = new THREE.Vector3(); if (ray.ray.intersectPlane(ebene, p)) geistBewegen(p); return; }
    const treffer = ray.intersectObjects(raum.children, true);
    for (const t of treffer) {
      let o = t.object; while (o && o !== raum && !(o.userData && (o.userData.item || o.userData.kristall || o.userData.lampe))) o = o.parent;
      if (!o || o === raum) continue;
      if (o.userData.kristall) { auswahl = null; markieren(null); reiter = "auftraege"; reiterZeigen(); ueberZeigen(); toast(zahl(stand.splitter) + " Splitter", stand.kristalle + " Kristalle · fürs Training"); return; }
      if (o.userData.lampe) { toast("Lampe", "brennt, solange deine Serie läuft"); return; }
      reiter = null; reiterZeigen(); auswahl = o; markieren(o); ueberZeigen(); return;
    }
    auswahl = null; markieren(null); ueberZeigen();
  }
  function markieren(o) {
    if (ring) { ring.parent && ring.parent.remove(ring); ring = null; }
    if (!o || !o.userData.item) return;
    const k = KATALOG.find(x => x.key === o.userData.item.key);
    const f = k.fp ? fp(k, 0) : [4, 1]; const r = Math.max(f[0], f[1]) * ZELLE * .62 + .15;
    ring = new THREE.Mesh(new THREE.RingGeometry(r, r + .08, 56), new THREE.MeshBasicMaterial({ color: farbwelt().farbe, transparent: true, opacity: .85, side: THREE.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = .015; if (k.kat === "wand") ring.position.z = .6; o.add(ring);
  }

  // ---------- Baumodus ----------
  let baumodus = null;
  function baumodusStarten(obj, neu) {
    auswahl = null; markieren(null);
    const it = obj.userData.item;
    baumodus = { obj: obj, it: it, neu: neu, alt: { i: it.i, j: it.j, rot: it.rot }, i: it.i, j: it.j, rot: it.rot };
    rasterZeigen(true); geistAktualisieren(); ueberZeigen();
    toast(KATALOG.find(k => k.key === it.key).name, "Ziehen zum Verschieben");
  }
  function rasterZeigen(an) {
    if (rasterLinien) { raum.remove(rasterLinien); rasterLinien = null; }
    if (!an) return;
    const S = STUFEN[stand.stufe].S, N = S / ZELLE, pts = [];
    for (let i = 0; i <= N; i++) { const p = -S / 2 + i * ZELLE; pts.push(p, .02, -S / 2, p, .02, S / 2 - GANG * ZELLE); }
    for (let j = 0; j <= N - GANG; j++) { const p = -S / 2 + j * ZELLE; pts.push(-S / 2, .02, p, S / 2, .02, p); }
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    rasterLinien = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: farbwelt().farbe, transparent: true, opacity: .22 }));
    raum.add(rasterLinien);
  }
  function geistBewegen(p) {
    const k = KATALOG.find(x => x.key === baumodus.it.key), f = fp(k, baumodus.rot), S = STUFEN[stand.stufe].S;
    baumodus.i = Math.round((p.x + S / 2) / ZELLE - f[0] / 2); baumodus.j = Math.round((p.z + S / 2) / ZELLE - f[1] / 2);
    geistAktualisieren();
  }
  function geistAktualisieren() {
    const b = baumodus, k = KATALOG.find(x => x.key === b.it.key), f = fp(k, b.rot);
    const N = STUFEN[stand.stufe].S / ZELLE;
    b.i = Math.max(0, Math.min(N - f[0], b.i)); b.j = Math.max(0, Math.min(N - GANG - f[1], b.j));
    b.ok = passt(k, b.i, b.j, b.rot, b.it.id);
    b.obj.position.copy(weltPos(k, b.i, b.j, b.rot)); b.obj.rotation.y = -b.rot * Math.PI / 2;
    if (geist) raum.remove(geist);
    geist = new THREE.Mesh(new THREE.PlaneGeometry(f[0] * ZELLE, f[1] * ZELLE), new THREE.MeshBasicMaterial({ color: b.ok ? 0x3ddc84 : 0xff7a70, transparent: true, opacity: .32, depthWrite: false }));
    geist.rotation.x = -Math.PI / 2; geist.position.set(b.obj.position.x, .025, b.obj.position.z); raum.add(geist);
    const fertig = document.getElementById("bau-fertig"); if (fertig) fertig.disabled = !b.ok;
  }
  function bauleisteBauen() {
    const l = document.createElement("div"); l.className = "bauleiste";
    const d = document.createElement("button"); d.type = "button"; d.innerHTML = ICON.drehen + "Drehen";
    d.onclick = () => { baumodus.rot = (baumodus.rot + 1) % 4; geistAktualisieren(); };
    const z = document.createElement("button"); z.type = "button"; z.innerHTML = baumodus.neu ? ICON.lager + "Lager" : "Abbrechen";
    z.onclick = () => {
      const b = baumodus;
      if (b.neu) { stand.items = stand.items.filter(x => x.id !== b.it.id); delete b.it.i; delete b.it.j; stand.lager.push(b.it); raum.remove(b.obj); objekte.splice(objekte.indexOf(b.obj), 1); toast("Im Lager", "Später aufstellen unter Bauen"); }
      else { b.i = b.alt.i; b.j = b.alt.j; b.rot = b.alt.rot; geistAktualisieren(); }
      bauEnde(false);
    };
    const f = document.createElement("button"); f.type = "button"; f.className = "fertig"; f.id = "bau-fertig"; f.innerHTML = ICON.haken + "Fertig";
    f.onclick = () => { const b = baumodus; if (!b.ok) return toast("Kein Platz", "Rot heißt: da steht schon etwas"); b.it.i = b.i; b.it.j = b.j; b.it.rot = b.rot; bauEnde(true); };
    l.append(d, z, f);
    setTimeout(geistAktualisieren, 0);
    return l;
  }
  function bauEnde(gespeichert) {
    if (geist) { raum.remove(geist); geist = null; }
    rasterZeigen(false);
    if (gespeichert && !ruhig) funkenBei(baumodus.obj.position, 30);
    baumodus = null; merken(); kopfZeigen(); ueberZeigen(); besucherAnpassen();
  }

  // ---------- Schleife ----------
  const uhr = new THREE.Clock();
  function bild() {
    const dt = Math.min(.05, uhr.getDelta()), t = uhr.elapsedTime, jetzt = performance.now();
    blick.winkel += (blick.ziel - blick.winkel) * .12;
    if (!zug && !ruhig && !baumodus) blick.ziel *= .996;
    if (blick.soll) { const q = ruhig ? 1 : .14; ['wpp', 'mx', 'my', 'dy'].forEach(k => blick.ist[k] += (blick.soll[k] - blick.ist[k]) * q); }
    kameraSetzen(); frustum();
    if (raum && raum.userData.wachsen) { const s = raum.scale.x + (1 - raum.scale.x) * .1; raum.scale.set(s, s, s); if (s > .999) { raum.scale.set(1, 1, 1); raum.userData.wachsen = false; } }
    if (!ruhig && raum) {
      objekte.concat(wandObjekte).forEach((g, n) => {
        if (g.userData.zustand === "glaenzt") { g.userData.glanz.forEach(m => m.emissiveIntensity = 1 + Math.sin(t * 2 + n) * .5); if (g.userData.halo) g.userData.halo.material.opacity = .5 + Math.sin(t * 2 + n) * .15; }
        if (g.userData.plakette) g.userData.plakette.position.y = (BAU_HOEHE[g.userData.item.key] || 1.4) + .45 + Math.sin(t * 2.2 + n) * .07;
        if (g.userData.wachsen) { const p = Math.min(1, (jetzt - g.userData.wachsen) / 650), e = 1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2), s = Math.max(.01, e); g.scale.set(s, s, s); if (p >= 1) { g.scale.set(1, 1, 1); delete g.userData.wachsen; } }
        g.children.forEach(c => { if (!c.isPoints || !c.userData.staub) return; const a = c.geometry.attributes.position; c.userData.seed.forEach((s, i) => { a.array[i * 3] = s[0] + Math.sin(t * .3 + i) * .05; a.array[i * 3 + 1] = (s[1] + t * s[3] * .25) % 2.4; a.array[i * 3 + 2] = s[2] + Math.cos(t * .27 + i) * .05; }); a.needsUpdate = true; });
        if (g.userData.neonLicht) g.userData.neonLicht.intensity = .6 + (Math.random() < .015 ? -.5 : 0);
      });
      lampen.forEach((l, n) => { const f = l.basis * (1 + Math.sin(t * 9 + n) * .06 + Math.sin(t * 23.7 + n) * .05) - (Math.random() < .015 ? .5 : 0); l.licht.intensity = (istNacht() ? 1.3 : 1) * f; l.mat.emissiveIntensity = 1.6 + (f - l.basis) * 2; });
      if (kristallObj) { kristallObj.rotation.y = t * .6; kristallObj.position.y = 1.0 + Math.sin(t * 1.4) * .05; }
      raum.userData.spots.forEach((s, n) => { s.target.position.x += Math.sin(t * .4 + n * 2) * .01; });
      besucher.forEach(b => besucherSchritt(b, dt, t));
      funken = funken.filter(f => { const d = (jetzt - f.userData.start) / 1000; if (f.userData.blase) { if (d > 1.8) { raum.remove(f); return false; } f.position.y = 1.75 + d * .35; f.material.opacity = d < 1.3 ? 1 : 1 - (d - 1.3) / .5; const sc = .38 * Math.min(1, d * 6); f.scale.set(sc, sc, 1); return true; } const a = f.geometry.attributes.position; if (d > 1.3) { raum.remove(f); return false; } f.userData.vel.forEach((v, i) => { a.array[i * 3] += v[0] * .016; a.array[i * 3 + 1] += (v[1] - d * 6) * .016; a.array[i * 3 + 2] += v[2] * .016; }); a.needsUpdate = true; f.material.opacity = 1 - d / 1.3; return true; });
      if (ring) ring.material.opacity = .55 + Math.sin(t * 4) * .25;
      if (geist) geist.material.opacity = .26 + Math.sin(t * 5) * .1;
    }
    renderer.render(szene, kamera);
    requestAnimationFrame(bild);
  }

  // Tag und Nacht nach der Uhrzeit
  function tageszeit() {
    const n = istNacht();
    himmel.intensity = n ? .26 : .34; sonne.intensity = n ? .4 : .72; sonne.color.setHex(n ? 0x9fb2e0 : 0xe4ecff);
  }

  addEventListener("resize", () => kameraAnpassen(true));
  farbeAnwenden(); tageszeit(); kopfZeigen(); reiterZeigen(); raumBauen(false); ueberZeigen();
  $("laden").remove();
  $("pille-splitter").onclick = $("pille-kristalle").onclick = () => { auswahl = null; markieren(null); reiter = "auftraege"; reiterZeigen(); ueberZeigen(); };
  window.__gym = { zustaende: () => objekte.map(o => [o.userData.item.key, o.userData.zustand, !!o.userData.halo, o.userData.halo && o.userData.halo.material.opacity]), stand: () => stand, eintragen: (g, r) => trainingEintragen(heute(), g, r, null), importieren: importieren };
  requestAnimationFrame(bild);
})();
